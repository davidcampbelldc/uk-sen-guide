# Senlit Retrieval evaluation set — graded queries across 6 types.
#
# Ground-truth matchers are open-schema dicts against chunk metadata:
#   source:            matches chunk.metadata.source
#   section_ref:       matches chunk.section_ref (SEND CoP numbered paragraphs, e.g. "1.1")
#   local_authority:   matches chunk.metadata.local_authority
#   charity:           matches chunk.metadata.charity
#   doc_id_contains:   substring match on chunk.doc_id
#   text_contains:     case-insensitive substring match on chunk.text (use for topic anchors)
#   any other key:     exact match against chunk.metadata[key]
#
# Relevance: 2 = directly answers, 1 = substantially helpful.

queries:

  # ── Statutory citation (SEND CoP expected) ────────────────────────────────
  - id: q001
    type: statutory-citation
    query: "What does the SEND Code of Practice say about local authority duties under Section 19 of the Children and Families Act 2014?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "Section 19 of the Children and Families Act"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "have regard to"}
        relevance: 1

  - id: q002
    type: statutory-citation
    query: "Under the SEND Code of Practice, what are the principles for identifying children with special educational needs?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "identifying"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "special educational needs"}
        relevance: 1

  - id: q003
    type: statutory-citation
    query: "What does the SEND Code of Practice say about Education Health and Care needs assessments?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "EHC needs assessment"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "needs assessment"}
        relevance: 1

  - id: q004
    type: statutory-citation
    query: "What guidance does the SEND Code of Practice give on mediation and disagreement resolution?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "mediation"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "disagreement resolution"}
        relevance: 2

  - id: q005
    type: statutory-citation
    query: "What does the SEND Code of Practice say about preparing young people for adulthood?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "preparing for adulthood"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "post-16"}
        relevance: 1

  - id: q006
    type: statutory-citation
    query: "What does the SEND Code of Practice say about the role of a school's SEN coordinator (SENCO)?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "SENCO"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "SEN coordinator"}
        relevance: 2

  - id: q007
    type: statutory-citation
    query: "What does the SEND Code of Practice say about personal budgets for EHCP provision?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "personal budget"}
        relevance: 2

  # ── Symptom-driven (parent voice) ──────────────────────────────────────────
  - id: q008
    type: symptom-driven
    query: "My 7 year old has autism and the school keeps saying he's just being naughty. What are my rights?"
    relevant:
      - match: {text_contains: "autism"}
        relevance: 2
      - match: {text_contains: "exclusion"}
        relevance: 1
      - match: {source: "charity-site", charity: "IPSEA"}
        relevance: 1

  - id: q009
    type: symptom-driven
    query: "My child can't read at the expected level and the teacher says he's just lazy. What should I do?"
    relevant:
      - match: {text_contains: "learning difficulties"}
        relevance: 2
      - match: {text_contains: "reading"}
        relevance: 1

  - id: q010
    type: symptom-driven
    query: "My daughter with ADHD is struggling to cope with secondary school transition. What support is available?"
    relevant:
      - match: {text_contains: "transition"}
        relevance: 2
      - match: {text_contains: "secondary"}
        relevance: 1

  - id: q011
    type: symptom-driven
    query: "My son has sensory processing differences and refuses to eat school meals. What reasonable adjustments can I request?"
    relevant:
      - match: {text_contains: "sensory"}
        relevance: 2
      - match: {text_contains: "reasonable adjustment"}
        relevance: 2

  - id: q012
    type: symptom-driven
    query: "School is threatening to exclude my child with SEN. What are our rights?"
    relevant:
      - match: {text_contains: "exclusion"}
        relevance: 2
      - match: {source: "charity-site", charity: "IPSEA", text_contains: "exclusion"}
        relevance: 2

  - id: q013
    type: symptom-driven
    query: "My autistic teenager is anxious about moving to college. What SEND support exists post-16?"
    relevant:
      - match: {text_contains: "post-16"}
        relevance: 2
      - match: {text_contains: "autism"}
        relevance: 1
      - match: {text_contains: "further education"}
        relevance: 1

  - id: q014
    type: symptom-driven
    query: "My child with dyslexia needs extra time in exams. How do I request reasonable adjustments?"
    relevant:
      - match: {text_contains: "reasonable adjustment"}
        relevance: 2
      - match: {text_contains: "exam"}
        relevance: 1

  - id: q015
    type: symptom-driven
    query: "My 4 year old shows developmental delays. When should I seek SEN support?"
    relevant:
      - match: {text_contains: "early years"}
        relevance: 2
      - match: {text_contains: "identifying"}
        relevance: 1

  - id: q016
    type: symptom-driven
    query: "My child was refused an EHC plan and I think it's wrong. What can I do?"
    relevant:
      - match: {text_contains: "appeal"}
        relevance: 2
      - match: {text_contains: "refuse"}
        relevance: 2
      - match: {source: "charity-site", charity: "IPSEA"}
        relevance: 2

  # ── Process / how-to ───────────────────────────────────────────────────────
  - id: q017
    type: process
    query: "How do I apply for an EHCP needs assessment for my child?"
    relevant:
      - match: {text_contains: "request"}
        relevance: 2
      - match: {text_contains: "EHC needs assessment"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "request an EHC needs assessment"}
        relevance: 2

  - id: q018
    type: process
    query: "How do I appeal to the SEND Tribunal against an EHCP decision?"
    relevant:
      - match: {text_contains: "appeal"}
        relevance: 2
      - match: {text_contains: "SEND Tribunal"}
        relevance: 2
      - match: {source: "charity-site", charity: "IPSEA", text_contains: "appeal"}
        relevance: 2

  - id: q019
    type: process
    query: "What is the process for getting an Education Health and Care plan reviewed annually?"
    relevant:
      - match: {text_contains: "annual review"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "annual review"}
        relevance: 2

  - id: q020
    type: process
    query: "How do I request a personal budget for my child's EHCP provision?"
    relevant:
      - match: {text_contains: "personal budget"}
        relevance: 2

  - id: q021
    type: process
    query: "What is the process for choosing a school for my child with an EHCP?"
    relevant:
      - match: {text_contains: "school"}
        relevance: 1
      - match: {source: "gov.uk/send-cop", text_contains: "parental preference"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "Section 41"}
        relevance: 1

  - id: q022
    type: process
    query: "How do I request home-to-school transport for my child with SEND?"
    relevant:
      - match: {text_contains: "transport"}
        relevance: 2
      - match: {text_contains: "home to school"}
        relevance: 2

  - id: q023
    type: process
    query: "How do I start the EHC needs assessment mediation process with the local authority?"
    relevant:
      - match: {text_contains: "mediation"}
        relevance: 2
      - match: {text_contains: "local authority"}
        relevance: 1

  - id: q024
    type: process
    query: "What's the difference between SEN support and an Education Health and Care plan?"
    relevant:
      - match: {text_contains: "SEN support"}
        relevance: 2
      - match: {text_contains: "EHC plan"}
        relevance: 2

  # ── Timing / deadline ──────────────────────────────────────────────────────
  - id: q025
    type: timing
    query: "How long does the local authority have to respond to an EHC needs assessment request?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "6 weeks"}
        relevance: 2
      - match: {text_contains: "response"}
        relevance: 1

  - id: q026
    type: timing
    query: "What is the statutory timeframe for issuing an Education Health and Care plan?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "20 weeks"}
        relevance: 2
      - match: {text_contains: "timeframe"}
        relevance: 1

  - id: q027
    type: timing
    query: "How long do I have to appeal an EHC plan decision to the SEND Tribunal?"
    relevant:
      - match: {text_contains: "2 months"}
        relevance: 2
      - match: {text_contains: "appeal"}
        relevance: 1
      - match: {text_contains: "deadline"}
        relevance: 1

  - id: q028
    type: timing
    query: "When must the annual review of an EHC plan be completed?"
    relevant:
      - match: {text_contains: "annual review"}
        relevance: 2
      - match: {text_contains: "12 months"}
        relevance: 1

  # ── Rights / refusal ───────────────────────────────────────────────────────
  - id: q029
    type: rights-refusal
    query: "Can a local authority refuse to carry out an EHC needs assessment?"
    relevant:
      - match: {source: "gov.uk/send-cop", text_contains: "refuse to carry out"}
        relevance: 2
      - match: {source: "gov.uk/send-cop", text_contains: "criteria"}
        relevance: 1
      - match: {source: "charity-site", charity: "IPSEA", text_contains: "refuse"}
        relevance: 2

  - id: q030
    type: rights-refusal
    query: "Can the school refuse to accept my child's EHCP and named placement?"
    relevant:
