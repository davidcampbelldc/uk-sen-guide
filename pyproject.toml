[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senlit-retrieval"
version = "0.1.0"
description = "Hybrid retrieval (BM25 + dense + cross-encoder rerank) over UK Special Educational Needs guidance"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "David Campbell" }]
keywords = ["retrieval", "rag", "hybrid-search", "bm25", "cross-encoder"]

dependencies = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "bm25s>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "typer>=0.12",
    "ranx>=0.3.20",
    "tqdm>=4.66",
    "numpy>=1.26",
    "rich>=13.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "prometheus-fastapi-instrumentator>=7.1",
    "structlog>=25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008 is a false positive for the recommended typer.Option(...) default pattern
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
